# Interface no modo de uso (specs/011-modo-de-uso/research.md, R-03 e R-04).

server {
    listen 8080;
    server_name _;

    # Sem versão do servidor nos cabeçalhos e nas páginas de erro (FR-003).
    server_tokens off;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # A API só é alcançada por aqui. O Host enviado ao Django é sempre "backend" (hosts fixos,
    # FR-005), e o X-Forwarded-For leva o endereço de quem acessa, para o limite de tentativas de
    # login contar por dispositivo (FR-008).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome: podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Rotas da interface (ex.: /meses/7) caem no index.html, que nunca fica em cache velho.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
