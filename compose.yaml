name: grana

# Valores padrão de desenvolvimento: o sistema sobe sem .env (FR-010).
# Um .env na raiz (copiado de .env.example) sobrescreve qualquer um deles.
x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-grana}
  POSTGRES_USER: ${POSTGRES_USER:-grana}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grana-dev-senha}

services:
  db:
    image: postgres:17-alpine
    environment: *postgres-env
    volumes:
      # Volume nomeado (grana_pgdata): sobrevive a down, restart, reboot e rebuild.
      # Só "docker compose down -v" remove os dados (FR-005, FR-006).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem "ports": o banco só é acessível pela rede interna do Compose (FR-019).

  backend:
    build: ./backend
    # Migra e sobe o servidor. "docker compose run --rm backend pytest" substitui este comando
    # e por isso não migra o banco real.
    command: ["sh", "scripts/start-dev.sh"]
    environment:
      <<: *postgres-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      GRANA_CADASTRO_ABERTO: ${GRANA_CADASTRO_ABERTO:-1}
      GRANA_SESSAO_ACESSO_MINUTOS: ${GRANA_SESSAO_ACESSO_MINUTOS:-30}
      GRANA_SESSAO_RENOVACAO_DIAS: ${GRANA_SESSAO_RENOVACAO_DIAS:-7}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    environment:
      # Destino do proxy /api na rede interna (sem prefixo VITE_: não vai para o navegador).
      API_PROXY_TARGET: http://backend:8000
      VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Só o código-fonte é montado (recarga sem rebuild, FR-015). O node_modules fica na
      # imagem: sem volume anônimo, nada vaza a cada down/up e "up --build" basta após mudar
      # dependências. Mudanças em index.html, vite.config.js ou package.json pedem rebuild.
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
